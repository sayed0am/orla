<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Orla</title>
		<meta name="description" content="Orla — a personal assistant that lives at the edge." />
		<script>
			(() => {
				try {
					const t = localStorage.getItem("orla-theme");
					if (
						t === "dark" ||
						(t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
					) {
						document.documentElement.dataset.theme = "dark";
					}
				} catch (_) {}
			})();
		</script>
		<meta name="theme-color" content="#f4f4f6" id="meta-theme-color" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="preload" href="/fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="icon" href="/icons/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Orla" />
	</head>
	<body>
		<noscript>Orla needs JavaScript enabled to run.</noscript>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
